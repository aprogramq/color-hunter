[package]
name = "color-hunter"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
authors = ["aprogramq <aprogramb@gmail.com>"]
description = "A terminal color palette generator"
readme = "README.md"
repository = "https://github.com/aprogramq/color-hunter"
homepage = "https://github.com/aprogramq/color-hunter"
license = "MIT"
keywords = ["color", "palette", "generator", "tui", "terminal"]
categories = ["command-line-utilities"]
exclude = ["assets/color-hunter.gif"]

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
palette = "0.7.6"
rand = "0.10.2"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tachyonfx = "0.25.1"
toml = "1.1.2"
users = "0.11.0"
